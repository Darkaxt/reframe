# Installers: `npm run dist` builds them for the current system into dist/ (`npm run dist:dir` only the
# unpacked app). Releases are built and published by .github/workflows/release.yml.
appId: dev.reframe.app
productName: reframe
copyright: Copyright (c) 2026 reframe Team
directories:
  output: dist
  buildResources: build
files:
  - resources/icon.png
  - resources/tray.png
  - resources/tray@2x.png
  - docs/provider-icons.md
  - out/**
  - package.json
  - LICENSE
  - README.md
  - '!dist/**'
  - '!test-results/**'
  - '!**/*.{map,pdb}'
  # node-pty's sources and the build tools it ships; the prebuilt (or, on Linux, freshly built) binaries stay.
  - '!node_modules/node-pty/{deps,scripts,src,third_party,typings}/**'
# node-pty and koffi bring native code; programs (OpenConsole.exe, winpty-agent.exe) and node-pty's worker
# script must be real files on disk, not inside the app archive.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@koromix/**
extraResources:
  - from: maintenance/history_backend.py
    to: history_backend.py
  - from: maintenance/windows/stop-managed.ps1
    to: maintenance/windows/stop-managed.ps1
  - from: maintenance/windows/release-files.ps1
    to: maintenance/windows/release-files.ps1
# node-pty and koffi are Node-API modules: their binaries work in Electron as they are.
npmRebuild: false
# Chromium's own UI strings (context menus, dialogs) only for reframe's languages.
electronLanguages: [en-US, de]

win:
  target: nsis
  # Same artwork as the tray (maintenance/make-icons.py); 16/32 px are the tray's own images.
  icon: build/icon.ico
  # The Rust PTY host (REFRAME_PTYHOST=rust; docs/ptyhost-protocol.md), built by CI (rust/dist/reframe-host.exe),
  # with node-pty's ConPTY next to it.
  extraResources:
    - from: rust/dist/reframe-host.exe
      to: reframe-host/reframe-host.exe
    - from: node_modules/node-pty/prebuilds/win32-x64/conpty/conpty.dll
      to: reframe-host/conpty.dll
    - from: node_modules/node-pty/prebuilds/win32-x64/conpty/OpenConsole.exe
      to: reframe-host/OpenConsole.exe
  files:
    # A platform matcher with exclusions alone implicitly includes the entire project.
    # Keep positive runtime patterns here too, including when output lives outside dist/.
    - resources/icon.png
    - resources/tray.png
    - resources/tray@2x.png
    - out/**
    - package.json
    - docs/provider-icons.md
    - LICENSE
    - README.md
    - '!dist/**'
    - '!test-results/**'
    - '!**/*.{map,pdb}'
    - '!node_modules/node-pty/{deps,scripts,src,third_party,typings}/**'
    - '!node_modules/node-pty/prebuilds/darwin-*/**'
    - '!node_modules/node-pty/prebuilds/win32-arm64/**'
nsis:
  # Per user, no admin rights, no questions: installs and starts.
  oneClick: true
  perMachine: false
  artifactName: ${productName}-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false

mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  files:
    - '!node_modules/node-pty/prebuilds/win32-*/**'
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target: [AppImage, deb]
  category: Development
  synopsis: Claude Code sessions side by side
  maintainer: reframe Team
  files:
    - '!node_modules/node-pty/prebuilds/**'
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  provider: github
  owner: Darkaxt
  repo: reframe
  releaseType: release
